      <script>
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="strict-parent-classification"]');
        const q = gsap.utils.selector(root);
        const baseLinks = q('.base-link');
        const traceLinks = q('.trace-link');
        [...baseLinks, ...traceLinks].forEach((path) => {
          const length = path.getTotalLength();
          path.style.strokeDasharray = `${length}`;
          path.style.strokeDashoffset = `${length}`;
        });
        const tl = gsap.timeline({ paused:true });
        tl.fromTo(q('#tree-field'), { opacity:0, scale:.985 }, { opacity:1, scale:1, duration:.52, ease:'power3.out' }, .12)
          .to(baseLinks, { strokeDashoffset:0, duration:.72, stagger:.055, ease:'power2.out' }, .18)
          .fromTo(q('.tree-node'), { opacity:0, y:18, scale:.96 }, { opacity:1, y:0, scale:1, duration:.46, stagger:.055, ease:'power3.out' }, .3)
          .addLabel('establish-taxonomy', .95)
          .fromTo(q('#instance-card'), { opacity:0, x:36, scale:.9 }, { opacity:1, x:0, scale:1, duration:.55, ease:'expo.out' }, 1.08)
          .addLabel('reveal-instance', 1.65)
          .fromTo(q('#dock-slot'), { opacity:0, scale:.94 }, { opacity:1, scale:1, duration:.38, ease:'power2.out' }, 1.82)
          .to(q('.sibling-node'), { color:'#56625c', backgroundColor:'#f0ede4', borderColor:'#9ea8a1', duration:.4, ease:'power1.out' }, 2.12)

          .to(q('#trace-instance-mammals'), { strokeDashoffset:0, duration:.34, ease:'power2.out' }, 3.62)
          .to(q('#trace-mammals-vertebrates'), { strokeDashoffset:0, duration:.62, ease:'power2.out' }, 3.92)
          .to(q('#node-vertebrates'), { backgroundColor:'#e1ebdd', borderColor:'#3a6c52', color:'#315f49', duration:.3, ease:'power1.out' }, 4.24)
          .to(q('#trace-vertebrates-animals'), { strokeDashoffset:0, duration:.58, ease:'power2.out' }, 4.45)
          .to(q('#node-animals'), { backgroundColor:'#d4e4d1', borderColor:'#3a6c52', color:'#315f49', duration:.3, ease:'power1.out' }, 4.78)
